<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>

		<title>Finally a Postgres Communication Hub for Experts and Newcomers &middot; PGConf.EU 2026</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/percona.css">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="dist/plugin/highlight/monokai.css" />
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section
					data-markdown="slides/slides.md"
					data-separator="^---$"
					data-separator-vertical="^--$"
					data-separator-notes="^Note:"
					data-charset="utf-8">
				</section>
			</div>
		</div>
		<script src="dist/reveal.js"></script>
		<script>
			// PDF export should keep every slide to one page and show full fragments at once
			const isPrintingToPdf = window.location.search.includes("print-pdf");
			const printConfig = isPrintingToPdf
			  ? { pdfSeparateFragments: false, pdfMaxPagesPerSlide: 1 }
			  : {};
		</script>
		<script src="dist/plugin/notes.js"></script>
		<script src="dist/plugin/markdown.js"></script>
		<script src="dist/plugin/highlight.js"></script>
		<script>
			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			Reveal.initialize({
				hash: true,

				// Keep slides at a fixed 16:9 base size and avoid upscaling on large screens.
				// This keeps long text blocks from being blown up and overflowing.
				width: 1920,
				height: 1080,
				maxScale: 1,
				...printConfig,

				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
			});
		</script>
	</body>
</html>
